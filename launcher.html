<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft Launcher</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.2rem;
            border-bottom: 1px solid #555555;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1a1a;
            border: 1px solid #444444;
            padding: 25px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #cccccc;
        }
        select, button {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 1.1rem;
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 20px;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        select option {
            background-color: #222222;
            color: #ffffff;
        }
        .mode-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .mode-card {
            flex: 1;
            background-color: #222222;
            border: 1px solid #555555;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .mode-card.selected {
            border-color: #8ab4f8;
            background-color: #2a2a2a;
        }
        .mode-card h3 {
            margin: 0 0 5px 0;
            color: #8ab4f8;
        }
        .mode-card p {
            margin: 0;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        button.launch-btn {
            background-color: #388e3c;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        button.launch-btn:hover {
            background-color: #4caf50;
        }
        #frameContainer {
            display: none;
            width: 100%;
            max-width: 1100px;
            height: 650px;
            margin-top: 20px;
            border: 1px solid #555555;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Eaglercraft Launcher</h1>
    
    <div class="container" id="configPanel">
        <label for="versionSelect">Select Client Version:</label>
        <select id="versionSelect">
            <option value="client-1.12-js.html">Eaglercraft 1.12 (JS)</option>
            <option value="client-1.12-wasm.html">Eaglercraft 1.12 (WASM)</option>
            <option value="client-1.5-js.html">Eaglercraft 1.5 (JS)</option>
            <option value="client-1.8-js.html">Eaglercraft 1.8 (JS)</option>
            <option value="client-1.8-wasm.html">Eaglercraft 1.8 (WASM)</option>
        </select>

        <label>Select Launch Mode:</label>
        <div class="mode-group">
            <div class="mode-card selected" id="modeFrame" onclick="setMode('frame')">
                <h3>Frame Mode</h3>
                <p>Embeds and runs the client inside an interactive container frame.</p>
            </div>
            <div class="mode-card" id="modeFile" onclick="setMode('file')">
                <h3>Game File Mode</h3>
                <p>Loads the raw client file directly in the browser window.</p>
            </div>
        </div>

        <button class="launch-btn" onclick="launchGame()">Launch Game</button>
    </div>

    <div id="frameContainer">
        <iframe id="gameFrame"></iframe>
    </div>

    <script>
        let currentMode = 'frame';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFrame').classList.toggle('selected', mode === 'frame');
            document.getElementById('modeFile').classList.toggle('selected', mode === 'file');
        }

        function launchGame() {
            const select = document.getElementById('versionSelect');
            const targetFile = select.value;

            if (currentMode === 'file') {
                // Actual game file mode: opens the standalone client file directly
                window.location.href = '/' + targetFile;
            } else {
                // Frame mode: hides config panel and loads the client inside the iframe
                document.getElementById('configPanel').style.display = 'none';
                const container = document.getElementById('frameContainer');
                const iframe = document.getElementById('gameFrame');
                container.style.display = 'block';
                iframe.src = '/' + targetFile;
            }
        }
    </script>
</body>
</html>
